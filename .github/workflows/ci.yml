# CI pipeline — runs on every push and pull request to main
# Tests the service, builds a Docker image, and (on main) pushes to Docker Hub

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    # Spin up Redis as a service container so integration tests have a real Redis
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true   # don't block on lint warnings during learning

      - name: Run tests with coverage
        run: npm test
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          KAFKA_ENABLED: 'false'   # disable Kafka in CI — no broker available

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test   # only build if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t distributed-rate-limiter:${{ github.sha }} .

      # Push to Docker Hub only on merges to main, not on PRs
      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag distributed-rate-limiter:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/distributed-rate-limiter:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/distributed-rate-limiter:latest
